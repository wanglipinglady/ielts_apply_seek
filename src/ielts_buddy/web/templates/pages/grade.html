{% extends "base.html" %}

{% block page_title %}AI 批改{% endblock %}

{% block content %}
<section class="grade-page">
  <div class="grade-form">
    <h2>AI 作文批改</h2>
    <p class="lede">提交您的 IELTS 作文，获取 AI 智能评分和改进建议。</p>

    <form id="grade-form" onsubmit="submitEssay(event)">
      <div class="form-group">
        <label for="task-type">题型</label>
        <select id="task-type" name="task_type">
          <option value="task2" selected>Task 2 (议论文)</option>
          <option value="task1_academic">Task 1 Academic (图表)</option>
          <option value="task1_general">Task 1 General (书信)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="topic">话题（可选）</label>
        <input type="text" id="topic" name="topic" placeholder="例如：教育、环境、科技">
      </div>

      <div class="form-group">
        <label for="essay">作文内容 *</label>
        <textarea id="essay" name="essay" rows="15" required
                  placeholder="在此粘贴您的作文..."></textarea>
        <div class="word-count"><span id="word-count">0</span> 词</div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">提交批改</button>
    </form>
  </div>

  {# === 批改结果面板 === #}
  <div id="grade-result" class="grade-result" hidden>
    <h2>批改结果
      <span id="source-badge" class="source-badge" hidden></span>
    </h2>

    <div class="score-overview">
      <div class="overall-score">
        <span class="score-value" id="overall-score">--</span>
        <span class="score-label">总分 (Band)</span>
      </div>
      <div class="band-scores">
        <div class="band-item">
          <span class="band-name">任务回应</span>
          <span class="band-value" id="band-task-response">--</span>
        </div>
        <div class="band-item">
          <span class="band-name">连贯衔接</span>
          <span class="band-value" id="band-coherence">--</span>
        </div>
        <div class="band-item">
          <span class="band-name">词汇资源</span>
          <span class="band-value" id="band-lexical">--</span>
        </div>
        <div class="band-item">
          <span class="band-name">语法准确性</span>
          <span class="band-value" id="band-grammar">--</span>
        </div>
      </div>
    </div>

    <div class="result-section">
      <h3>问题分析</h3>
      <div id="error-analysis" class="error-list"></div>
    </div>

    <div class="result-section">
      <h3>改进建议</h3>
      <ul id="suggestions" class="suggestion-list"></ul>
    </div>

    <div class="result-section" id="rewrite-section" hidden>
      <h3>高分改写示例</h3>
      <div id="rewrite" class="rewrite-box"></div>
    </div>

    <div class="result-section" id="annotations-section" hidden>
      <h3>句子级问题标注</h3>
      <div id="annotations-list" class="annotations-list"></div>
    </div>

    <div class="result-section" id="paragraphs-section" hidden>
      <h3>段落结构分析</h3>
      <div id="paragraphs-list" class="paragraphs-list"></div>
    </div>

    <div class="result-actions">
      <button class="btn-secondary" onclick="resetForm()">重新批改</button>
      <button class="btn-secondary" onclick="saveToPersonal()">保存到个人词库</button>
      <a class="btn-secondary" href="/api/grade/history?limit=20" target="_blank">查看历史（JSON）</a>
    </div>
  </div>
</section>

<script>
const essayInput = document.getElementById('essay');
const wordCountSpan = document.getElementById('word-count');

essayInput.addEventListener('input', () => {
    const words = essayInput.value.trim().split(/\s+/).filter(w => w).length;
    wordCountSpan.textContent = words;
});

async function submitEssay(event) {
    event.preventDefault();

    const essay = document.getElementById('essay').value.trim();
    if (essay.length < 50) {
        alert('作文内容太短，请至少输入 50 个单词');
        return;
    }

    const taskType = document.getElementById('task-type').value;
    const topic = document.getElementById('topic').value;

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = '批改中（约 10-60s）...';

    // 长任务提示：8s 后按钮加注
    const longHint = setTimeout(() => {
        if (submitBtn.disabled) {
            submitBtn.textContent = '仍在批改，请稍候...';
        }
    }, 8000);

    const formData = new FormData();
    formData.append('essay', essay);
    formData.append('task_type', taskType);
    if (topic) formData.append('topic', topic);

    try {
        const response = await fetch('/api/grade/submit', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            showResults(data.result, data._meta || {});
        } else {
            const error = await response.json();
            alert('批改失败: ' + (error.detail || '未知错误'));
        }
    } catch (error) {
        alert('批改失败: ' + error.message);
    } finally {
        clearTimeout(longHint);
        submitBtn.disabled = false;
        submitBtn.textContent = '提交批改';
    }
}

function showResults(result, meta) {
    document.querySelector('.grade-form').hidden = true;
    document.getElementById('grade-result').hidden = false;

    // 来源徽章：真实 LLM / 降级 mock
    const badge = document.getElementById('source-badge');
    if (meta.source === 'mock') {
        badge.textContent = '⚠️ LLM 不可用，本次为本地估算（mock）';
        badge.className = 'source-badge source-mock';
        badge.hidden = false;
    } else if (meta.source === 'llm') {
        badge.textContent = '✓ 真实 LLM 评分';
        badge.className = 'source-badge source-llm';
        badge.hidden = false;
    } else {
        badge.hidden = true;
    }

    document.getElementById('overall-score').textContent = result.overall_score;

    const scores = result.band_scores;
    document.getElementById('band-task-response').textContent = scores.task_response;
    document.getElementById('band-coherence').textContent = scores.coherence;
    document.getElementById('band-lexical').textContent = scores.lexical_resource;
    document.getElementById('band-grammar').textContent = scores.grammar;

    // 错误分析：容忍两种 schema（list[str] 或 计数 dict）
    const errorList = document.getElementById('error-analysis');
    const errors = result.error_summary || {};
    const errorStats = result.error_stats || {};
    let errorHtml = '';

    for (const [type, items] of Object.entries(errors)) {
        if (Array.isArray(items) && items.length > 0) {
            errorHtml += `<div class="error-category">
                <h4>${type === 'grammar' ? '语法' : type === 'vocabulary' ? '词汇' : type === 'coherence' ? '连贯' : type === 'style' ? '风格' : type}</h4>
                <ul>${items.map(item => `<li>${escapeHtml(String(item))}</li>`).join('')}</ul>
            </div>`;
        }
    }
    // 计数补充
    const statsHtml = Object.keys(errorStats).length
        ? `<p class="error-stats">问题统计：${Object.entries(errorStats).map(([k, v]) => `${typeName(k)}=${v}`).join('，')}</p>`
        : '';
    errorList.innerHTML = errorHtml || statsHtml || '<p>未发现明显错误</p>';

    // 建议
    const suggestionList = document.getElementById('suggestions');
    suggestionList.innerHTML = (result.suggestions || []).map(s => `<li>${escapeHtml(String(s))}</li>`).join('');

    // 高分改写
    const rewriteSection = document.getElementById('rewrite-section');
    const rewriteEl = document.getElementById('rewrite');
    if (result.rewrite) {
        rewriteEl.textContent = result.rewrite;
        rewriteSection.hidden = false;
    } else {
        rewriteSection.hidden = true;
    }

    // 句子级标注
    const annSection = document.getElementById('annotations-section');
    const annList = document.getElementById('annotations-list');
    if (Array.isArray(result.annotations) && result.annotations.length > 0) {
        annList.innerHTML = result.annotations.map(ann => `
            <div class="annotation-item ann-${escapeHtml(ann.severity || 'minor')}">
                <div class="ann-head">
                    <span class="ann-issue">${escapeHtml(ann.issue_type || '?')}</span>
                    <span class="ann-sev">${escapeHtml(ann.severity || 'minor')}</span>
                </div>
                <div class="ann-original">${escapeHtml(ann.original || '')}</div>
                ${ann.comment ? `<div class="ann-comment">说明：${escapeHtml(ann.comment)}</div>` : ''}
                ${ann.suggestion ? `<div class="ann-sug">建议：${escapeHtml(ann.suggestion)}</div>` : ''}
            </div>
        `).join('');
        annSection.hidden = false;
    } else {
        annSection.hidden = true;
    }

    // 段落结构
    const paraSection = document.getElementById('paragraphs-section');
    const paraList = document.getElementById('paragraphs-list');
    if (Array.isArray(result.paragraphs) && result.paragraphs.length > 0) {
        paraList.innerHTML = result.paragraphs.map(p => `
            <div class="para-item">
                <div class="para-head">
                    <span class="para-role">${escapeHtml(roleName(p.role))}</span>
                    <span class="para-score">${p.structure_score}/9</span>
                    ${p.has_topic_sentence ? '<span class="para-ts">✓ 有主题句</span>' : ''}
                </div>
                ${p.comment ? `<div class="para-comment">${escapeHtml(p.comment)}</div>` : ''}
                ${Array.isArray(p.cohesion_devices) && p.cohesion_devices.length ? `<div class="para-cohesion">衔接词：${p.cohesion_devices.map(d => escapeHtml(String(d))).join('、')}</div>` : ''}
            </div>
        `).join('');
        paraSection.hidden = false;
    } else {
        paraSection.hidden = true;
    }
}

function escapeHtml(s) {
    return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function typeName(k) {
    const map = {grammar: '语法', vocabulary: '词汇', coherence: '连贯', style: '风格'};
    return map[k] || k;
}

function roleName(r) {
    const map = {introduction: '引言段', body: '主体段', conclusion: '结论段'};
    return map[r] || r;
}

function resetForm() {
    document.querySelector('.grade-form').hidden = false;
    document.getElementById('grade-result').hidden = true;
    document.getElementById('grade-form').reset();
    document.getElementById('word-count').textContent = '0';
}

function saveToPersonal() {
    alert('功能开发中：保存批改结果到个人词库');
}
</script>

<style>
.grade-page {
    max-width: 800px;
    margin: 0 auto;
}

.grade-form {
    background: var(--bg-secondary);
    border-radius: 12px;
    padding: 32px;
    border: 1px solid var(--border-color);
}

.grade-form h2 {
    color: var(--primary-color);
    margin-bottom: 8px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 14px;
}

.form-group textarea {
    font-family: inherit;
    resize: vertical;
    line-height: 1.6;
}

.word-count {
    text-align: right;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}

.grade-result {
    background: var(--bg-secondary);
    border-radius: 12px;
    padding: 32px;
    border: 1px solid var(--border-color);
}

.grade-result h2 {
    color: var(--primary-color);
    margin-bottom: 24px;
}

.score-overview {
    display: flex;
    gap: 32px;
    margin-bottom: 32px;
    flex-wrap: wrap;
}

.overall-score {
    text-align: center;
    padding: 24px 32px;
    background: var(--primary-light);
    border-radius: 12px;
}

.score-value {
    display: block;
    font-size: 64px;
    font-weight: 700;
    color: var(--primary-color);
    font-family: var(--font-mono);
}

.score-label {
    font-size: 14px;
    color: var(--text-muted);
}

.band-scores {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.band-item {
    padding: 16px;
    background: var(--bg-primary);
    border-radius: 8px;
    text-align: center;
}

.band-name {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
}

.band-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
}

.result-section {
    margin-bottom: 24px;
}

.result-section h3 {
    font-size: 16px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
}

.error-list {
    display: grid;
    gap: 16px;
}

.error-category {
    padding: 12px;
    background: #fef2f2;
    border-radius: 8px;
    border-left: 3px solid #ef4444;
}

.error-category h4 {
    font-size: 13px;
    margin-bottom: 8px;
    color: #dc2626;
}

.error-category ul {
    margin: 0;
    padding-left: 20px;
    font-size: 13px;
    line-height: 1.8;
}

.suggestion-list {
    padding-left: 20px;
}

.suggestion-list li {
    margin-bottom: 8px;
    line-height: 1.6;
}

.result-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.btn-primary {
    padding: 12px 32px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-secondary {
    padding: 12px 24px;
    background: var(--bg-secondary);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

/* === 来源徽章 === */
.source-badge {
    display: inline-block;
    margin-left: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    vertical-align: middle;
}
.source-llm {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #6ee7b7;
}
.source-mock {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fcd34d;
}

/* === 高分改写 === */
.rewrite-box {
    padding: 14px 18px;
    background: var(--bg-primary);
    border-left: 3px solid #10b981;
    border-radius: 4px;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 14px;
}

/* === 句级标注 === */
.annotations-list {
    display: grid;
    gap: 12px;
}
.annotation-item {
    padding: 12px 16px;
    background: var(--bg-primary);
    border-radius: 6px;
    border-left: 3px solid #94a3b8;
}
.annotation-item.ann-major { border-left-color: #f59e0b; }
.annotation-item.ann-critical { border-left-color: #ef4444; }
.ann-head {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
}
.ann-issue {
    background: #e0e7ff;
    color: #3730a3;
    padding: 2px 8px;
    border-radius: 10px;
}
.ann-sev {
    color: var(--text-muted);
}
.ann-original {
    font-style: italic;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-size: 13px;
}
.ann-comment, .ann-sug {
    font-size: 13px;
    line-height: 1.6;
}
.ann-sug {
    color: #065f46;
    margin-top: 4px;
}

/* === 段落结构 === */
.paragraphs-list {
    display: grid;
    gap: 12px;
}
.para-item {
    padding: 12px 16px;
    background: var(--bg-primary);
    border-radius: 6px;
    border-left: 3px solid #6366f1;
}
.para-head {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
}
.para-role {
    background: #e0e7ff;
    color: #3730a3;
    padding: 2px 8px;
    border-radius: 10px;
}
.para-score {
    color: var(--text-main);
    font-weight: 600;
}
.para-ts {
    color: #065f46;
    font-size: 12px;
}
.para-comment {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-main);
}
.para-cohesion {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
}
.error-stats {
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--bg-primary);
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-muted);
}
</style>
{% endblock %}
