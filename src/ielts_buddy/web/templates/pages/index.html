{% extends "base.html" %}

{% block page_title %}首页{% endblock %}

{% block content %}
<div style="text-align:center;padding:60px 20px;">
  <h1 style="font-size:32px;margin-bottom:16px;">欢迎使用 IELTS Buddy</h1>
  <p style="font-size:16px;color:var(--text-muted);margin-bottom:32px;">
    你的雅思词汇学习助手，基于艾宾浩斯记忆曲线，科学规划复习。
  </p>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    {% if current_user %}
      <a href="/dashboard" class="btn-primary" style="padding:14px 28px;font-size:16px;">进入学习</a>
    {% else %}
      <a href="/register" class="btn-primary" style="padding:14px 28px;font-size:16px;">立即注册</a>
      <a href="/login" class="btn" style="padding:14px 28px;font-size:16px;">登录</a>
    {% endif %}
  </div>
</div>
{% endblock %}
