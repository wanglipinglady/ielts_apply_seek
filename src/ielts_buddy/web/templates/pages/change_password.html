{% extends "auth_base.html" %}

{% block content %}
<section class="auth-card">
  <h1>修改密码</h1>
  <p class="lede">修改成功后需要重新登录。</p>

  <form id="change-pwd-form" class="auth-form"
        hx-post="/api/auth/change-password"
        hx-trigger="submit"
        hx-swap="none"
        hx-headers='{"Authorization":"Bearer " + (localStorage.ib_access_token || "")}'
        hx-on::after-request="handleChangePwdResponse(event)">
    <label class="field">
      <span class="field-label">当前密码</span>
      <div class="input-with-toggle">
        <input id="old_password" type="password" name="old_password"
               required autocomplete="current-password" />
        <button type="button" class="pwd-toggle"
                data-target="old_password"
                aria-label="显示密码">👁</button>
      </div>
    </label>
    <label class="field">
      <span class="field-label">新密码</span>
      <div class="input-with-toggle">
        <input id="new_password" type="password" name="new_password"
               minlength="8" required autocomplete="new-password" />
        <button type="button" class="pwd-toggle"
                data-target="new_password"
                aria-label="显示密码">👁</button>
      </div>
      <span class="field-hint">至少 8 位</span>
    </label>
    <label class="field">
      <span class="field-label">确认新密码</span>
      <div class="input-with-toggle">
        <input id="confirm_password" type="password"
               minlength="8" required autocomplete="new-password" />
        <button type="button" class="pwd-toggle"
                data-target="confirm_password"
                aria-label="显示密码">👁</button>
      </div>
    </label>

    <div id="change-pwd-error" class="auth-error" hidden></div>
    <div id="change-pwd-success" class="auth-success" hidden></div>
    <button type="submit" class="btn-primary">保存新密码</button>
  </form>

  <p class="auth-foot">
    <a href="/dashboard">返回仪表盘</a>
  </p>
</section>

<script>
  // 1) 通用：密码可见切换（事件委托，所有带 .pwd-toggle 的按钮都生效）
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.pwd-toggle');
    if (!btn) return;
    const targetId = btn.dataset.target;
    const input = document.getElementById(targetId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
      btn.setAttribute('aria-label', '隐藏密码');
    } else {
      input.type = 'password';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', '显示密码');
    }
  });

  // 2) 提交后响应处理
  function handleChangePwdResponse(event) {
    const xhr = event.detail.xhr;
    const errBox = document.getElementById('change-pwd-error');
    const okBox  = document.getElementById('change-pwd-success');

    // 401：未登录 / token 失效
    if (xhr.status === 401) {
      errBox.textContent = '登录状态已失效，请重新登录。';
      errBox.hidden = false;
      okBox.hidden = true;
      setTimeout(() => { window.location.href = '/login'; }, 1200);
      return;
    }

    if (xhr.status === 200) {
      errBox.hidden = true;
      okBox.textContent = '密码已更新，请用新密码重新登录。';
      okBox.hidden = false;
      setTimeout(() => {
        localStorage.removeItem('ib_access_token');
        window.location.href = '/login';
      }, 1500);
    } else {
      let msg = '修改失败';
      try {
        const body = JSON.parse(xhr.responseText);
        msg = (body && (body.detail || body.message)) || msg;
      } catch (_) {}
      errBox.textContent = msg;
      errBox.hidden = false;
      okBox.hidden = true;
    }
  }

  // 3) 提交前：本地校验新密码两次是否一致
  document.getElementById('change-pwd-form').addEventListener('submit', (e) => {
    const np = document.getElementById('new_password').value;
    const cp = document.getElementById('confirm_password').value;
    const errBox = document.getElementById('change-pwd-error');
    if (np !== cp) {
      e.preventDefault();
      errBox.textContent = '两次输入的新密码不一致';
      errBox.hidden = false;
    }
  });
</script>
{% endblock %}
