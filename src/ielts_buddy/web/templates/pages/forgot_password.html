{% extends "auth_base.html" %}

{% block content %}
<section class="auth-card">
  <h1>忘记密码</h1>
  <p class="lede">
    填写注册邮箱，密码将被重置为默认密码
    <code class="default-pwd">12345678</code>。
    <br>重置后请尽快在「修改密码」页改成自己的强密码。
  </p>

  <form id="forgot-pwd-form" class="auth-form"
        hx-post="/api/auth/forgot-password"
        hx-trigger="submit"
        hx-swap="none"
        hx-on::after-request="handleForgotPwdResponse(event)">
    <label class="field">
      <span class="field-label">注册邮箱</span>
      <input type="email" name="email" required autocomplete="email" />
    </label>

    <div id="forgot-pwd-error" class="auth-error" hidden></div>
    <button type="submit" class="btn-primary">重置为默认密码</button>
  </form>

  <p class="auth-foot">
    <a href="/login">返回登录</a>
  </p>
</section>

<script>
  function handleForgotPwdResponse(event) {
    const xhr = event.detail.xhr;
    const errBox = document.getElementById('forgot-pwd-error');
    const form  = document.getElementById('forgot-pwd-form');
    const card  = form.closest('.auth-card');

    // 清掉旧的展示区
    card.querySelectorAll('.forgot-pwd-result, .auth-success').forEach(n => n.remove());
    errBox.hidden = true;

    if (xhr.status === 200) {
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch (_) {}

      // 1) 成功提示（绿色）
      const ok = document.createElement('div');
      ok.className = 'auth-success';
      ok.innerHTML = `✓ 密码已重置！请用以下默认密码登录：<br>
        <strong class="default-pwd">${body.new_password || '12345678'}</strong>`;
      form.insertAdjacentElement('afterend', ok);

      // 2) 大号展示框（醒目，避免用户漏看）
      const result = document.createElement('div');
      result.className = 'forgot-pwd-result';
      result.innerHTML = `
        <div class="result-title">✓ 重置成功</div>
        <div class="result-row">
          <span class="result-label">邮箱</span>
          <span class="result-value">${body.email || ''}</span>
        </div>
        <div class="result-row">
          <span class="result-label">默认密码</span>
          <span class="result-value default-pwd">${body.new_password || '12345678'}</span>
        </div>
        <div class="result-tip">
          请<strong>立即</strong>用此密码
          <a href="/login">登录</a>，
          然后到「修改密码」改成自己的强密码。
        </div>
      `;
      ok.insertAdjacentElement('afterend', result);

      // 隐藏表单（避免重复提交）
      form.style.display = 'none';
    } else {
      let msg = '重置失败';
      try {
        const body = JSON.parse(xhr.responseText);
        msg = (body && (body.detail || body.message)) || msg;
      } catch (_) {}
      errBox.textContent = msg;
      errBox.hidden = false;
    }
  }
</script>
{% endblock %}
