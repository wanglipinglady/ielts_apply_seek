{% extends "auth_base.html" %}

{% block content %}
<section class="auth-card">
  <h1>登录</h1>
  <p class="lede">用注册时的邮箱和密码登录。</p>

  <form id="login-form" class="auth-form"
        hx-post="/api/auth/login"
        hx-trigger="submit"
        hx-swap="none"
        hx-on::after-request="handleAuthResponse(event)">
    <label class="field">
      <span class="field-label">邮箱</span>
      <input type="email" name="email" required autocomplete="email" />
    </label>
    <label class="field">
      <span class="field-label">密码</span>
      <div class="input-with-toggle">
        <input id="login_password" type="password" name="password"
               required autocomplete="current-password" />
        <button type="button" class="pwd-toggle"
                data-target="login_password"
                aria-label="显示密码">👁</button>
      </div>
    </label>
    <div id="login-error" class="auth-error" hidden></div>
    <button type="submit" class="btn-primary">登录</button>
  </form>

  <p class="auth-foot">
    还没有账号？<a href="/register">立即注册</a><br>
    忘记密码？<a href="/forgot-password">重置为默认密码</a><br>
    想改密码？<a href="/change-password">修改密码</a>
  </p>
</section>

<script>
  // 密码可见切换（事件委托，与 change_password.html 共享同一逻辑）
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.pwd-toggle');
    if (!btn) return;
    const targetId = btn.dataset.target;
    const input = document.getElementById(targetId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
      btn.setAttribute('aria-label', '隐藏密码');
    } else {
      input.type = 'password';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', '显示密码');
    }
  });

  // 认证响应处理：服务器已设置 cookie，JS 同步到 localStorage 供 API 调用
  function handleAuthResponse(event) {
    const xhr = event.detail.xhr;
    const errBox = document.getElementById('login-error');
    if (xhr.status === 200 || xhr.status === 201) {
      try {
        const body = JSON.parse(xhr.responseText);
        if (body.access_token) {
          localStorage.setItem('ib_access_token', body.access_token);
        }
      } catch (_) { /* ignore */ }
      window.location.href = '/dashboard';
    } else {
      let msg = '登录失败';
      try {
        const body = JSON.parse(xhr.responseText);
        msg = body.detail || msg;
      } catch (_) { /* ignore */ }
      errBox.textContent = msg;
      errBox.hidden = false;
    }
  }
</script>
{% endblock %}
