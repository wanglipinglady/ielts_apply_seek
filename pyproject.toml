[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-buddy"
version = "0.1.0"
description = "IELTS vocabulary learning CLI tool with spaced repetition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "IELTS Buddy Team"}]
keywords = ["ielts", "vocabulary", "cli", "spaced-repetition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "openai>=1.0",          # 新增
    "anthropic>=0.30",      # 可选，如果你用 anthropic provider
    "sqlalchemy>=2.0",      # W3：MySQL 容器依赖
    "pymysql>=1.1",         # W3：MySQL 驱动（MySQL 8 默认 sha2 还需 cryptography）
    "cryptography>=41.0",   # W3：pymysql 走 caching_sha2_password 时必装
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
# Web 可选依赖：CLI 用户不需要装
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "email-validator>=2.1",
    "httpx>=0.27",  # TestClient 后端
]
all = [
    "openai>=1.0",
    "anthropic>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=41.0",
]

[project.scripts]
ib = "ielts_buddy.cli:cli"
ielts = "ielts_buddy.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ielts_buddy = [
    "data/*.json",
    "templates/*.html",
    "web/templates/**/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[tool.ruff]
line-length = 100
target-version = "py310"
