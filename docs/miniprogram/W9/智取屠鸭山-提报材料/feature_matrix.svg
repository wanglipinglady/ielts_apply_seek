<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="mountainTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3A5F"/>
      <stop offset="100%" stop-color="#4FA3D1"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0F6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="640" fill="url(#bg2)"/>

  <!-- 顶部标题栏（远山意境） -->
  <rect x="0" y="0" width="960" height="100" fill="url(#mountainTitle)"/>
  <path d="M 0 80 L 80 50 L 160 70 L 280 40 L 400 60 L 520 30 L 640 50 L 760 35 L 880 55 L 960 45 L 960 100 L 0 100 Z" fill="#0F2D4D" opacity="0.4"/>
  <text x="480" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">「屠鸭口语磨炼」· 9 项 AI 备考功能</text>
  <text x="480" y="60" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFD24A">登顶雅思 7 分的 9 条磨炼路径 · 个人开发 · 永久免费 · 无广告</text>
  <text x="480" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.8">Whisper + LLM + 艾宾浩斯曲线 · 三大 AI 引擎护航</text>

  <!-- 海拔轴线（登山高度 = 功能优先级） -->
  <line x1="60" y1="540" x2="900" y2="540" stroke="#999" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="480" y="568" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666">登山高度 ∝ 用户使用频率（从左到右）</text>

  <!-- 9 个功能 = 9 座山峰，从低到高排列 -->
  <!-- 山峰 1：错词本复习（基础层） -->
  <g transform="translate(80 540)">
    <path d="M 0 0 L -30 0 L -22 -28 L -8 -52 L 0 -68 L 8 -52 L 22 -28 L 30 0 Z" fill="#D0D8E0"/>
    <text x="0" y="-78" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">错词本</text>
    <text x="0" y="-92" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 120m</text>
  </g>

  <!-- 山峰 2：阅读真题 -->
  <g transform="translate(180 540)">
    <path d="M 0 0 L -32 0 L -24 -32 L -10 -62 L 0 -82 L 10 -62 L 24 -32 L 32 0 Z" fill="#B8C4D0"/>
    <text x="0" y="-94" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">阅读真题</text>
    <text x="0" y="-108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 180m</text>
  </g>

  <!-- 山峰 3：番茄钟备考计划 -->
  <g transform="translate(280 540)">
    <path d="M 0 0 L -34 0 L -26 -36 L -10 -68 L 0 -92 L 10 -68 L 26 -36 L 34 0 Z" fill="#9DB1C4"/>
    <text x="0" y="-104" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">备考计划</text>
    <text x="0" y="-118" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 240m</text>
  </g>

  <!-- 山峰 4：数据复盘 -->
  <g transform="translate(380 540)">
    <path d="M 0 0 L -34 0 L -26 -40 L -10 -76 L 0 -104 L 10 -76 L 26 -40 L 34 0 Z" fill="#7A95B0"/>
    <text x="0" y="-116" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">数据复盘</text>
    <text x="0" y="-130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 310m</text>
  </g>

  <!-- 山峰 5：随机刷词 -->
  <g transform="translate(480 540)">
    <path d="M 0 0 L -36 0 L -28 -44 L -10 -82 L 0 -116 L 10 -82 L 28 -44 L 36 0 Z" fill="#5F7E9C"/>
    <text x="0" y="-128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">随机刷词</text>
    <text x="0" y="-142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 380m</text>
  </g>

  <!-- 山峰 6：单词背诵（雪山雪顶） -->
  <g transform="translate(580 540)">
    <path d="M 0 0 L -36 0 L -28 -48 L -10 -90 L 0 -130 L 10 -90 L 28 -48 L 36 0 Z" fill="#3D6488"/>
    <path d="M -10 -90 L 0 -130 L 10 -90 L 6 -100 L 0 -110 L -6 -100 Z" fill="url(#snow)"/>
    <text x="0" y="-142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">单词背诵</text>
    <text x="0" y="-156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 460m</text>
  </g>

  <!-- 山峰 7：智能体对话 -->
  <g transform="translate(680 540)">
    <path d="M 0 0 L -36 0 L -28 -50 L -10 -96 L 0 -138 L 10 -96 L 28 -50 L 36 0 Z" fill="#2E6B9E"/>
    <path d="M -10 -96 L 0 -138 L 10 -96 L 6 -106 L 0 -116 L -6 -106 Z" fill="url(#snow)"/>
    <text x="0" y="-150" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">智能体对话</text>
    <text x="0" y="-164" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#666">海拨 540m</text>
  </g>

  <!-- 山峰 8：口语 AI 评分（高峰雪顶） -->
  <g transform="translate(780 540)">
    <path d="M 0 0 L -38 0 L -30 -52 L -10 -100 L 0 -150 L 10 -100 L 30 -52 L 38 0 Z" fill="#1A3A5F"/>
    <path d="M -10 -100 L 0 -150 L 10 -100 L 6 -110 L 0 -122 L -6 -110 Z" fill="url(#snow)"/>
    <text x="0" y="-162" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#FFD24A">口语 AI</text>
    <text x="0" y="-176" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#FFD24A">海拨 640m</text>
  </g>

  <!-- 山峰 9：写作 AI 批改（最高峰，山顶红旗） -->
  <g transform="translate(880 540)">
    <path d="M 0 0 L -40 0 L -32 -56 L -12 -106 L 0 -170 L 12 -106 L 32 -56 L 40 0 Z" fill="#0F2D4D"/>
    <path d="M -12 -106 L 0 -170 L 12 -106 L 8 -118 L 0 -132 L -8 -118 Z" fill="url(#snow)"/>
    <!-- 红旗 -->
    <line x1="0" y1="-170" x2="0" y2="-194" stroke="#F5A623" stroke-width="1.5"/>
    <path d="M 0 -194 L 10 -191 L 0 -188 Z" fill="#F5A623"/>
    <text x="0" y="-206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#FFD24A">写作 AI</text>
    <text x="0" y="-220" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#FFD24A">海拨 760m（登顶）</text>
  </g>

  <!-- 底部登山路径（虚线小径连接 9 座山峰） -->
  <path d="M 50 540 Q 130 555 210 545 Q 290 535 370 545 Q 450 555 530 545 Q 610 535 690 545 Q 770 555 850 545 Q 910 540 910 540" stroke="#999" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.5"/>

  <!-- 底部说明 -->
  <text x="60" y="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">登山路线：</text>
  <text x="120" y="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333">从基础（错词本）到高峰（写作 AI），用户可根据目标自由选择登山路径</text>
  <text x="60" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1A3A5F">雪山雪顶：</text>
  <text x="120" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333">使用频率最高的 4 项核心功能（单词 / 智能体 / 口语 / 写作）</text>
</svg>