<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <!-- 深蓝天幕（夜登意境，象征努力的人） -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1E3F"/>
      <stop offset="50%" stop-color="#1A3A5F"/>
      <stop offset="100%" stop-color="#2E5A8E"/>
    </linearGradient>
    <!-- 雪山渐变 -->
    <linearGradient id="snowMt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8F0F6"/>
      <stop offset="100%" stop-color="#B8C8D8"/>
    </linearGradient>
    <!-- 暗色山体 -->
    <linearGradient id="darkMt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3A5F"/>
      <stop offset="100%" stop-color="#0F2D4D"/>
    </linearGradient>
    <!-- 智取光晕（山顶 AI 智慧光环） -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4A0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFD24A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD24A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="144" height="144" rx="28" ry="28" fill="url(#sky)"/>

  <!-- 星空点缀（努力的星火） -->
  <circle cx="20" cy="22" r="0.8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="36" cy="14" r="0.6" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="52" cy="26" r="0.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="108" cy="18" r="0.7" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="124" cy="30" r="0.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="92" cy="10" r="0.4" fill="#FFFFFF" opacity="0.5"/>

  <!-- 智取光晕（山顶 AI 智慧之光） -->
  <circle cx="72" cy="38" r="32" fill="url(#halo)"/>

  <!-- 远山层次（最深处） -->
  <path d="M 0 96 L 18 78 L 36 86 L 56 68 L 72 80 L 88 66 L 108 78 L 124 70 L 144 82 L 144 144 L 0 144 Z" fill="#0A1E3F" opacity="0.7"/>

  <!-- 中景山 -->
  <path d="M 0 112 L 28 84 L 48 96 L 72 76 L 96 94 L 116 82 L 144 100 L 144 144 L 0 144 Z" fill="url(#darkMt)" opacity="0.85"/>

  <!-- 主峰（屠鸭山·巍峨） -->
  <path d="M 0 124 L 30 90 L 52 102 L 72 56 L 92 100 L 116 84 L 144 110 L 144 144 L 0 144 Z" fill="url(#snowMt)"/>

  <!-- 山顶岩冠（智取顶） -->
  <path d="M 60 70 L 72 56 L 84 70 L 80 74 L 72 68 L 64 74 Z" fill="#FFFFFF"/>
  <ellipse cx="72" cy="72" rx="6" ry="2" fill="#E8F0F6"/>

  <!-- 登山学子剪影（山腰偏右，提灯夜行人） -->
  <g transform="translate(98 102)">
    <!-- 影子 -->
    <ellipse cx="0" cy="14" rx="6" ry="1.5" fill="#0A1E3F" opacity="0.4"/>
    <!-- 身体 -->
    <path d="M -3 14 L -2 4 L 2 4 L 3 14 Z" fill="#0A1E3F"/>
    <!-- 头部 -->
    <circle cx="0" cy="1" r="2.5" fill="#0A1E3F"/>
    <!-- 登山杖 -->
    <line x1="3" y1="-2" x2="6" y2="14" stroke="#0A1E3F" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 提灯（智取的智慧之光，象征学子用 AI 智慧照亮前路） -->
    <line x1="-3" y1="6" x2="-5" y2="2" stroke="#0A1E3F" stroke-width="0.6"/>
    <circle cx="-6" cy="2" r="1.8" fill="#FFD24A"/>
    <circle cx="-6" cy="2" r="3.2" fill="#FFD24A" opacity="0.3"/>
  </g>

  <!-- 登山路径（学子走过的路） -->
  <path d="M 110 132 Q 100 124 92 116 Q 88 110 90 104" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5,1.5" fill="none" opacity="0.6"/>

  <!-- 脚印（攀登的痕迹） -->
  <ellipse cx="106" cy="130" rx="1.2" ry="0.6" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="98" cy="126" rx="1.2" ry="0.6" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="92" cy="120" rx="1.2" ry="0.6" fill="#FFFFFF" opacity="0.4"/>

  <!-- "智取"二字顶部装饰小印 -->
  <g transform="translate(72 22)">
    <rect x="-9" y="-5" width="18" height="10" rx="1" fill="#FFD24A" opacity="0.95"/>
    <text x="0" y="3" text-anchor="middle" font-family="STKaiti, KaiTi, serif" font-size="8" font-weight="700" fill="#0A1E3F">智取</text>
  </g>
</svg>