name: CI

on: [push, pull_request]

jobs:
  # 阶段 1：契约测试（多端共享 API schema 守门员）
  # 先跑——失败立刻挂，不浪费后面全量测试的时间
  contract-tests:
    name: Contract Tests (CLI + Web + 小程序 共享契约)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        env:
          IELTS_BUDDY_ENV: dev
        run: |
          PYTHONPATH=src pytest tests/test_contracts/ -v --tb=short

  # 阶段 1.5：监控模块测试（事件触发型告警，2026-08-24 加）
  monitoring-tests:
    name: Monitoring Tests (通知 / 自愈 / 死信)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run monitoring tests
        env:
          IELTS_BUDDY_ENV: dev
        run: |
          PYTHONPATH=src pytest tests/test_monitoring/ -v --tb=short

  # 阶段 2：全量测试（CLI + Web + 集成）
  full-tests:
    needs: [contract-tests, monitoring-tests]  # ← 契约/监控任一挂就不跑全量，省 CI 时间
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run full test suite
        env:
          IELTS_BUDDY_ENV: dev
        run: |
          PYTHONPATH=src pytest --tb=short -q